[project]
name = "second-brain"
version = "0.1.0"
description = "Local second brain that turns browser history into an Obsidian knowledge base."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.2",
    "python-slugify>=8.0.0",
    "scikit-learn>=1.5.0",
    "sentence-transformers>=3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
second-brain = "second_brain.cli:main"
historico-navegacao = "second_brain.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
