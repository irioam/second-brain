[project]
name = "second-brain"
version = "0.1.0"
description = "Local second brain that turns browser history into an Obsidian knowledge base."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Irio Andre Moesch", email = "irioam@gmail.com" },
]
license = "MIT"
keywords = [
    "obsidian",
    "browser-history",
    "second-brain",
    "knowledge-base",
    "duckdb",
    "personal-knowledge-management",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Utilities",
]
dependencies = [
    "duckdb>=1.5.2",
    "python-slugify>=8.0.0",
    "scikit-learn>=1.5.0",
    "sentence-transformers>=3.0.0",
]

[project.urls]
Repository = "https://github.com/irioam/second-brain"
"Issue Tracker" = "https://github.com/irioam/second-brain/issues"
Homepage = "https://github.com/irioam/second-brain"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.11.0",
]

[tool.ruff]
target-version = "py311"
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "YTT"]

[tool.ruff.format]
quote-style = "double"

[project.scripts]
second-brain = "second_brain.cli:main"
historico-navegacao = "second_brain.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
